apiVersion: v1
kind: Namespace
metadata:
  name: canary
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-app
  namespace: canary
spec:
  replicas: 4
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: app
          image: demo-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: FAIL
              value: "false"
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
  strategy:
    canary:
      stableService: demo-app-stable
      canaryService: demo-app-canary
      canaryMetadata:
        labels:
          traffic_role: canary
      stableMetadata:
        labels:
          traffic_role: stable
      trafficRouting:
        nginx:
          stableIngress: demo-app-ingress
      analysis:
        startingStep: 1
        templates:
          - templateName: detai27-canary-quality
        args:
          - name: namespace
            value: canary
      steps:
        - setWeight: 5
        - pause: { duration: 2m }
        - setWeight: 25
        - pause: { duration: 2m }
        - setWeight: 50
        - pause: { duration: 2m }
        - setWeight: 100