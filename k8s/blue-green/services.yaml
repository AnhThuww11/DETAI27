apiVersion: v1
kind: Service
metadata:
  name: demo-app-active
  namespace: bluegreen
spec:
  selector:
    app: demo-app
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-preview
  namespace: bluegreen
spec:
  selector:
    app: demo-app
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-active
  namespace: bluegreen
spec:
  ingressClassName: nginx
  rules:
    - host: bg.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-app-active
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-preview
  namespace: bluegreen
spec:
  ingressClassName: nginx
  rules:
    - host: bg-preview.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-app-preview
                port:
                  number: 80