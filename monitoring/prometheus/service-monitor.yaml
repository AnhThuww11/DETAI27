apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-app
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - canary
  selector:
    matchLabels:
      app: demo-app
      monitoring: enabled
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
      scrapeTimeout: 5s
      honorLabels: false
      relabelings:
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_service_label_monitoring_role]
          targetLabel: traffic_role
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: service
