apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: detai27-canary-quality
  namespace: detai27
spec:
  args:
    - name: prometheus-url
      value: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
    - name: namespace
      value: detai27
  metrics:
    - name: canary-http-5xx-rate
      interval: 30s
      count: 5
      initialDelay: 30s
      successCondition: len(result) > 0 && result[0] >= 0 && result[0] <= 0.05
      failureCondition: len(result) > 0 && result[0] > 0.05
      failureLimit: 1
      inconclusiveLimit: 2
      provider:
        prometheus:
          address: '{{args.prometheus-url}}'
          query: |
            (
              sum(rate(http_requests_total{namespace="{{args.namespace}}",traffic_role="canary",status=~"5..",route="/"}[1m]))
              or vector(0)
            ) /
            sum(rate(http_requests_total{namespace="{{args.namespace}}",traffic_role="canary",route="/"}[1m]))
    - name: canary-p95-latency-seconds
      interval: 30s
      count: 5
      initialDelay: 30s
      successCondition: len(result) > 0 && result[0] >= 0 && result[0] <= 0.5
      failureCondition: len(result) > 0 && result[0] > 0.5
      failureLimit: 1
      inconclusiveLimit: 2
      provider:
        prometheus:
          address: '{{args.prometheus-url}}'
          query: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{namespace="{{args.namespace}}",traffic_role="canary",route="/"}[1m]))
            )
